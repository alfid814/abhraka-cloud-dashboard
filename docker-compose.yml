version: '3.8'

services:
  localstack:
    image: localstack/localstack:latest
    container_name: abhraka-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,sns,dynamodb,lambda,apigateway,cloudwatch,kinesis,ses,secretsmanager
      - DEBUG=1
      - PERSISTENCE=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ./localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - abhraka-network

  dashboard:
    build: .
    container_name: abhraka-dashboard
    ports:
      - "5000:5000"
    environment:
      - LOCALSTACK_ENDPOINT=http://localstack:4566
    depends_on:
      - localstack
    networks:
      - abhraka-network

networks:
  abhraka-network:
    driver: bridge
